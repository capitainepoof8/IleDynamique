# Optionnel : génère un vrai projet Xcode avec XcodeGen
#   brew install xcodegen && xcodegen generate && open IleDynamique.xcodeproj
name: IleDynamique
options:
  bundleIdPrefix: fr.iledynamique
  deploymentTarget:
    macOS: "14.0"
targets:
  IleDynamique:
    type: application
    platform: macOS
    sources:
      - path: Sources/IleDynamique
    postCompileScripts:
      - name: Aide de lecture
        script: |
          "$SRCROOT/scripts/construire-aide-lecture.sh" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/aide-lecture.dylib"
    settings:
      base:
        PRODUCT_NAME: IleDynamique
        PRODUCT_BUNDLE_IDENTIFIER: fr.iledynamique.app
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/IleDynamique.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
